name: Android APK
on:
  workflow_dispatch:
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: 'https://189.72.146.93/api/v1'
      npm_config_script_shell: /bin/bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: KAHE-mobile-attendance-frontend-api/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install mobile dependencies
        working-directory: KAHE-mobile-attendance-frontend-api
        run: npm ci --include=dev
      - name: Check mobile source
        working-directory: KAHE-mobile-attendance-frontend-api
        run: |
          npm test
          node node_modules/typescript/bin/tsc --noEmit
      - name: Generate Android project
        working-directory: KAHE-mobile-attendance-frontend-api
        run: node node_modules/expo/bin/cli prebuild --platform android --no-install
      - name: Install Android tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          python3 -c 'print("y\n" * 100)' > /tmp/android-licenses.txt
          sdkmanager --licenses < /tmp/android-licenses.txt > /dev/null
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Compile installable APK
        working-directory: KAHE-mobile-attendance-frontend-api/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' -PreactNativeArchitectures=arm64-v8a
      - name: Check signing identity against the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download android-v1.0.4 --repo "$GITHUB_REPOSITORY" --pattern KAHE-Attendance-1.0.4.apk --dir "$RUNNER_TEMP/previous-apk"
          printf '%s  %s\n' 'd46143d7a2398303313a17f2a7f7aecd238983ecfc8e8c55e5b2609e40929477' "$RUNNER_TEMP/previous-apk/KAHE-Attendance-1.0.4.apk" | sha256sum --check -
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/previous-apk/KAHE-Attendance-1.0.4.apk" > "$RUNNER_TEMP/previous-cert.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs KAHE-mobile-attendance-frontend-api/android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/current-cert.txt"
          diff <(grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/previous-cert.txt") <(grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/current-cert.txt")
      - name: Verify APK
        working-directory: KAHE-mobile-attendance-frontend-api/android
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release.apk
          grep -aFq "$EXPO_PUBLIC_API_URL" app/build/generated/assets/react/release/index.android.bundle
          if grep -aEq 'For testing|Server connection|Attendance server address|student.john@university.edu|password123' app/build/generated/assets/react/release/index.android.bundle; then
            echo 'A removed testing or server-switching control is present in the release bundle.' >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk-output/KAHE-Attendance-1.0.5.apk"
          cd "$GITHUB_WORKSPACE/apk-output"
          sha256sum KAHE-Attendance-1.0.5.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAHE-Attendance-1.0.5-APK
          path: apk-output/
          if-no-files-found: error
          retention-days: 14
